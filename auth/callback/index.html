<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GardenSage — Mot de passe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f7e8 0%, #e8f5e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2d5016; margin-bottom: 12px; }
        p { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #4a7c25;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #3d6820; }
        .success { color: #2d5016; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔑</div>
        <h1>Mot de passe modifié</h1>
        <p>Ton mot de passe a été réinitialisé avec succès. Tu peux maintenant te connecter dans l'app.</p>
        <a class="btn" id="openApp" href="gardensage://auth/callback">Ouvrir GardenSage</a>
    </div>
    <script>
        // Bug fix: hide technical URL parameters from the user and handle the deep link cleanly.
        // Supabase appends auth tokens in the URL fragment (#access_token=...&type=recovery).
        (function() {
            const hash = window.location.hash;

            // 1. Clean the URL bar immediately to hide technical parameters
            if (hash && window.history.replaceState) {
                window.history.replaceState(null, '', window.location.pathname);
            }

            // 2. Attempt to open the app with the auth tokens
            if (hash) {
                window.location.href = 'gardensage://auth/callback' + hash;
            }
        })();
    </script>
</body>
</html>
