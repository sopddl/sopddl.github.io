<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GardenSage — Invitation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f7e8 0%, #e8f5e0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; color: #2d5016; margin-bottom: 12px; }
        p { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #4a7c25;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #3d6820; }
        .subtitle { font-size: 13px; color: #999; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🌿</div>
        <h1>Tu es invité à rejoindre un jardin !</h1>
        <p>Un ami t'invite à prendre soin de son jardin ensemble sur GardenSage.</p>
        <a class="btn" id="openApp" href="#">Ouvrir GardenSage</a>
        <p class="subtitle">
            Tu n'as pas encore l'app ?<br>
            <a href="https://testflight.apple.com/join/zk1s7ZkJ" style="color: #4a7c25;">Télécharge-la via TestFlight</a>
        </p>
    </div>
    <script>
        // Extraire le token depuis l'URL
        const path = window.location.pathname;
        const token = path.split('/invite/')[1];
        const appLink = 'gardensage://invite/' + (token || '');
        document.getElementById('openApp').href = appLink;

        // Tenter d'ouvrir l'app automatiquement
        if (token) {
            window.location.href = appLink;
        }
    </script>
</body>
</html>
